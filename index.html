<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>광안리 밤바다 포차 · 리얼 합석 다이닝</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
      background: radial-gradient(circle at 50% 12%, #172544 0%, #0b1120 60%, #050811 100%);
      color: #f8fafc;
      min-height: 100vh;
      overflow-x: hidden;
      transition: background 0.9s ease;
    }
    body.xmas-body {
      background: radial-gradient(circle at 50% 10%, #3b1320 0%, #11221e 55%, #060b10 100%);
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8px 10px 20px;
    }
    @media (min-width: 640px) {
      body { padding: 14px 18px 28px; }
    }
    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      background: transparent;
      color: inherit;
    }
    svg {
      display: block;
      max-width: 100%;
      max-height: 100%;
    }
    .hidden { display: none !important; }
    .opacity-0 { opacity: 0 !important; }
    .opacity-100 { opacity: 1 !important; }

    /* Drunk Screen Blur, Warm Vignette & Sway Effect */
    #drunkVignetteOverlay {
      position: fixed;
      top: 0; right: 0; bottom: 0; left: 0;
      pointer-events: none;
      z-index: 35;
      opacity: 0;
      transition: opacity 0.6s ease;
      background: radial-gradient(circle at 50% 50%, transparent 42%, rgba(244, 63, 94, 0.24) 82%, rgba(159, 18, 57, 0.45) 100%);
    }
    @keyframes drunkSwayMild {
      0%, 100% { transform: rotate(0deg) translate3d(0, 0, 0); }
      25% { transform: rotate(0.45deg) translate3d(2px, 1px, 0); }
      75% { transform: rotate(-0.45deg) translate3d(-2px, -1px, 0); }
    }
    @keyframes drunkSwayTipsy {
      0%, 100% { transform: rotate(0deg) scale(1.005) translate3d(0, 0, 0); filter: blur(0.6px); }
      25% { transform: rotate(0.95deg) scale(1.01) translate3d(4px, 2px, 0); filter: blur(1.25px); }
      50% { transform: rotate(-0.3deg) scale(1.008) translate3d(-2px, 3px, 0); filter: blur(0.8px); }
      75% { transform: rotate(-1.0deg) scale(1.01) translate3d(-4px, -2px, 0); filter: blur(1.35px); }
    }
    @keyframes drunkSwayHeavy {
      0%, 100% { transform: rotate(0deg) scale(1.012) translate3d(0, 0, 0); filter: blur(1.2px) saturate(1.18); }
      20% { transform: rotate(1.5deg) scale(1.018) translate3d(6px, 3px, 0); filter: blur(2.2px) saturate(1.25); }
      50% { transform: rotate(-0.8deg) scale(1.015) translate3d(-5px, 4px, 0); filter: blur(1.5px) saturate(1.2); }
      80% { transform: rotate(-1.55deg) scale(1.018) translate3d(-6px, -3px, 0); filter: blur(2.3px) saturate(1.25); }
    }
    .drunk-stage-1 { animation: drunkSwayMild 5.2s ease-in-out infinite; }
    .drunk-stage-2 { animation: drunkSwayTipsy 4.2s ease-in-out infinite; }
    .drunk-stage-3 { animation: drunkSwayHeavy 3.3s ease-in-out infinite; }

    /* Main Outer Layout */
    #drunkCameraStage {
      width: 100%;
      max-width: 1220px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: filter 0.4s ease;
    }
    @media (min-width: 1024px) {
      #drunkCameraStage {
        flex-direction: row;
        align-items: stretch;
      }
    }

    .pocha-main-card {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      border-radius: 24px;
      overflow: hidden;
      border: 1px solid rgba(71, 85, 105, 0.7);
      background: rgba(9, 14, 28, 0.95);
      box-shadow: 0 24px 55px rgba(0, 0, 0, 0.8);
      transition: border-color 0.6s ease, box-shadow 0.6s ease;
    }
    .xmas-mode .pocha-main-card {
      border-color: rgba(251, 191, 36, 0.75);
      box-shadow: 0 24px 60px rgba(220, 38, 38, 0.25), 0 0 35px rgba(22, 163, 74, 0.2);
    }

    /* 1. Sky Header & Top Controls */
    .pocha-sky-header {
      position: relative;
      width: 100%;
      height: 158px;
      overflow: hidden;
      cursor: pointer;
      border-bottom: 1px solid rgba(251, 191, 36, 0.32);
    }
    @media (min-width: 640px) {
      .pocha-sky-header { height: 180px; }
    }
    #gwangalliSkyCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .sky-top-bar {
      position: absolute;
      top: 0; left: 0; right: 0;
      padding: 8px 12px;
      background: linear-gradient(180deg, rgba(2,6,23,0.92) 0%, rgba(2,6,23,0.45) 70%, transparent 100%);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      z-index: 12;
    }
    .sky-brand-group, .sky-btn-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }
    .pocha-title {
      margin: 0;
      font-size: 14px;
      font-weight: 900;
      color: #fef3c7;
      text-shadow: 0 2px 6px rgba(0,0,0,0.85);
    }
    @media (min-width: 640px) {
      .pocha-title { font-size: 16px; }
    }
    .top-pill {
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      border: 1px solid rgba(148, 163, 184, 0.42);
      background: rgba(15, 23, 42, 0.88);
      color: #f1f5f9;
      box-shadow: 0 2px 6px rgba(0,0,0,0.45);
      transition: transform 0.12s ease, filter 0.12s ease;
    }
    .top-pill:hover { filter: brightness(1.1); }
    .top-pill:active { transform: scale(0.95); }
    .top-pill-invite {
      background: rgba(12, 74, 110, 0.92);
      border-color: rgba(56, 189, 248, 0.6);
      color: #e0f2fe;
    }
    .top-pill-live {
      background: rgba(6, 78, 59, 0.92);
      border-color: rgba(52, 211, 153, 0.55);
      color: #6ee7b7;
    }
    .top-pill-firework {
      background: linear-gradient(90deg, #be185d, #d97706);
      border-color: rgba(252, 211, 77, 0.65);
      color: #ffffff;
    }
    .top-pill-hunt {
      background: linear-gradient(90deg, #db2777, #9333ea);
      border-color: rgba(244, 114, 182, 0.7);
      color: #ffffff;
    }
    .top-pill-bill-mobile {
      background: #fcd34d;
      color: #0f172a;
      border-color: #f59e0b;
    }
    @media (min-width: 1024px) {
      .top-pill-bill-mobile { display: none !important; }
    }

    .sky-gauge-bar {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 6px 12px;
      background: rgba(2, 6, 23, 0.88);
      border-top: 1px solid rgba(30, 41, 59, 0.9);
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 12;
    }
    .gauge-track {
      flex: 1;
      height: 10px;
      border-radius: 9999px;
      background: #1e293b;
      padding: 2px;
      border: 1px solid #334155;
      overflow: hidden;
    }
    #drunkGaugeFill {
      height: 100%;
      border-radius: 9999px;
      background: linear-gradient(90deg, #34d399 0%, #fbbf24 55%, #f43f5e 100%);
      transition: width 0.45s ease;
    }

    /* 2. Pocha Arena */
    #pochaArena {
      position: relative;
      width: 100%;
      padding: 16px 10px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 46%, rgba(251, 146, 60, 0.16) 0%, rgba(15, 23, 42, 0.96) 66%, #070b14 100%);
      transition: background 0.8s ease;
    }
    .xmas-mode #pochaArena {
      background:
        radial-gradient(circle at 50% 45%, rgba(239, 68, 68, 0.18) 0%, rgba(20, 45, 36, 0.94) 62%, #08100d 100%);
    }

    /* Christmas Tree Corner Prop (Visible in 2차 Christmas Mode) */
    #xmasTreeCorner {
      position: absolute;
      top: 16px;
      right: 12px;
      width: 68px;
      height: 92px;
      z-index: 10;
      pointer-events: none;
      filter: drop-shadow(0 8px 14px rgba(0, 0, 0, 0.65));
    }
    @media (min-width: 640px) {
      #xmasTreeCorner {
        width: 88px;
        height: 118px;
        right: 18px;
      }
    }
    @keyframes bulbBlink {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.82); }
    }
    .xmas-blink-a { animation: bulbBlink 1.3s ease-in-out infinite; }
    .xmas-blink-b { animation: bulbBlink 1.3s ease-in-out 0.65s infinite; }

    /* Surrounding Neighbor Pocha Tables (Left & Right AI Tables) */
    .neighbor-tables-layer {
      width: 100%;
      max-width: 780px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
      z-index: 11;
    }
    .neighbor-table-pod {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 6px 8px;
      border-radius: 18px;
      background: rgba(15, 23, 42, 0.72);
      border: 1px solid rgba(148, 163, 184, 0.25);
      min-width: 118px;
      max-width: 168px;
      box-shadow: 0 8px 18px rgba(0,0,0,0.45);
    }
    @media (min-width: 640px) {
      .neighbor-table-pod { min-width: 158px; padding: 8px 12px; }
    }
    .neighbor-patrons-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    .mini-neighbor-avatar {
      width: 44px;
      height: 50px;
      position: relative;
    }
    @media (min-width: 640px) {
      .mini-neighbor-avatar { width: 54px; height: 60px; }
    }
    .mini-silver-table {
      width: 78px;
      height: 22px;
      margin-top: -4px;
      border-radius: 9999px;
      background: linear-gradient(90deg, #64748b, #e2e8f0, #94a3b8, #475569);
      border: 1.5px solid #cbd5e1;
      box-shadow: 0 4px 10px rgba(0,0,0,0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      font-weight: 800;
      color: #0f172a;
    }
    .neighbor-bubble {
      position: absolute;
      top: -24px;
      left: 50%;
      transform: translateX(-50%);
      padding: 2px 8px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.95);
      color: #0f172a;
      font-size: 10px;
      font-weight: 800;
      white-space: nowrap;
      border: 1px solid #f472b6;
      box-shadow: 0 6px 14px rgba(0,0,0,0.45);
      z-index: 25;
    }

    /* Hunting / Approach Banner & Choice Buttons */
    #huntingApproachCard {
      position: absolute;
      top: 56px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 41;
      width: 92%;
      max-width: 430px;
      padding: 12px 14px;
      border-radius: 20px;
      background: rgba(15, 23, 42, 0.97);
      border: 2px solid #f472b6;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.85), 0 0 24px rgba(244, 114, 182, 0.35);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      text-align: center;
    }
    .hunt-choice-row {
      display: flex;
      gap: 10px;
      width: 100%;
      justify-content: center;
    }
    .hunt-btn-yes {
      flex: 1;
      padding: 8px 12px;
      border-radius: 12px;
      background: linear-gradient(90deg, #ec4899, #f43f5e);
      color: #ffffff;
      font-size: 12.5px;
      font-weight: 900;
      box-shadow: 0 6px 14px rgba(244, 63, 94, 0.4);
    }
    .hunt-btn-no {
      flex: 1;
      padding: 8px 12px;
      border-radius: 12px;
      background: #1e293b;
      border: 1px solid #64748b;
      color: #e2e8f0;
      font-size: 12.5px;
      font-weight: 800;
    }

    /* Warm Pocha String Bulbs */
    .pocha-bulb-row {
      width: 100%;
      max-width: 620px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      margin-top: -8px;
      margin-bottom: 6px;
      pointer-events: none;
      opacity: 0.92;
    }
    .pocha-bulb {
      width: 10px;
      height: 10px;
      border-radius: 9999px;
      background: #fef08a;
      box-shadow: 0 0 12px 3px rgba(251, 191, 36, 0.75);
      transition: all 0.5s ease;
    }
    .xmas-mode .pocha-bulb:nth-child(3n+1) {
      background: #ff4d6d;
      box-shadow: 0 0 13px 3px rgba(244, 63, 94, 0.85);
    }
    .xmas-mode .pocha-bulb:nth-child(3n+2) {
      background: #4ade80;
      box-shadow: 0 0 13px 3px rgba(74, 222, 128, 0.85);
    }
    .xmas-mode .pocha-bulb:nth-child(3n) {
      background: #fde047;
      box-shadow: 0 0 13px 3px rgba(250, 204, 21, 0.85);
    }

    #sceneStatusToast {
      position: absolute;
      top: 10px; left: 16px; right: 16px;
      z-index: 32;
      display: flex;
      justify-content: center;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .toast-pill-inner {
      padding: 6px 16px;
      border-radius: 9999px;
      background: rgba(15, 23, 42, 0.96);
      border: 1px solid rgba(251, 191, 36, 0.65);
      color: #fde68a;
      font-size: 12px;
      font-weight: 800;
      box-shadow: 0 10px 24px rgba(0,0,0,0.65);
      text-align: center;
    }

    /* Realistic Chef Walk-in Actor */
    #chefWalkActor {
      position: absolute;
      top: 24px; left: 0; right: 0;
      z-index: 28;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    .chef-off-left { transform: translateX(-120%); opacity: 0; }
    .chef-center-stage { transform: translateX(0%); opacity: 1; }
    .chef-off-right {
      transform: translateX(120%);
      opacity: 0;
      transition: transform 0.95s ease-in, opacity 0.4s ease 0.45s !important;
    }
    .chef-svg-box {
      width: 196px;
      height: 132px;
    }
    #chefSpeechBanner {
      margin-bottom: 4px;
      padding: 6px 14px;
      border-radius: 16px;
      background: rgba(69, 26, 3, 0.96);
      border: 1px solid rgba(252, 211, 77, 0.7);
      color: #fef3c7;
      font-size: 12px;
      font-weight: 800;
      box-shadow: 0 10px 24px rgba(0,0,0,0.75);
      text-align: center;
      max-width: 92%;
    }

    #interactionAnimLayer {
      position: absolute;
      top: 0; right: 0; bottom: 0; left: 0;
      z-index: 30;
      pointer-events: none;
      overflow: visible;
    }

    /* Portrait Animations */
    @keyframes portraitBreathe {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-2.2px); }
    }
    @keyframes eyeBlink {
      0%, 92%, 100% { transform: scaleY(1); }
      96% { transform
