<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🌊 광안리 밤바다 포차 - 실시간 멀티 술자리</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    background: #050814;
    color: #fff;
    width: 100vw;
    height: 100dvh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    touch-action: manipulation;
  }
  #app {
    position: relative;
    width: 100%;
    max-width: 430px;
    height: 100dvh;
    background: #0b1026;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 0 35px rgba(0,0,0,0.9);
  }
  /* 만취 흔들림 효과 */
  #app.drunk- dizzy { animation: sway 2.8s ease-in-out infinite; }
  @keyframes sway {
    0%, 100% { transform: rotate(0deg) scale(1); filter: blur(0px); }
    25% { transform: rotate(0.9deg) scale(1.01); filter: blur(0.6px); }
    75% { transform: rotate(-0.9deg) scale(1.01); filter: blur(0.6px); }
  }

  /* 1. 상단 광안리 밤바다 영역 */
  #sky-area {
    position: relative;
    width: 100%;
    height: 19.5dvh;
    min-height: 128px;
    border-bottom: 3px solid #3a2312;
    flex-shrink: 0;
  }
  #oceanCanvas { width: 100%; height: 100%; display: block; }
  .top-hud {
    position: absolute;
    top: 8px; left: 8px; right: 8px;
    display: flex; justify-content: space-between; align-items: center;
    gap: 6px; z-index: 10;
  }
  .badge-btn {
    background: rgba(9, 15, 38, 0.82);
    backdrop-filter: blur(6px);
    border: 1px solid rgba(255,209,102,0.45);
    color: #ffd166;
    padding: 5px 9px;
    border-radius: 10px;
    font-size: 11.5px;
    font-weight: 800;
    cursor: pointer;
    display: flex; align-items: center; gap: 4px;
  }
  .badge-btn:active { transform: scale(0.95); }
  .tipsy-bar-wrap {
    position: absolute;
    bottom: 6px; left: 10px; right: 10px;
    background: rgba(8, 12, 28, 0.82);
    border-radius: 8px;
    padding: 4px 8px;
    display: flex; align-items: center; gap: 8px;
    border: 1px solid rgba(255,255,255,0.14);
    z-index: 10;
  }
  .tipsy-label { font-size: 10.5px; font-weight: 700; white-space: nowrap; color: #e2eafc; }
  .tipsy-track { flex: 1; height: 7px; background: #1c2541; border-radius: 4px; overflow: hidden; }
  .tipsy-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #06d6a0, #ffd166, #ff4d6d); transition: width 0.25s; }

  /* 2. 포장마차 테이블 & 캐릭터 & 큰 은쟁반 */
  #pocha-stage {
    flex: 1;
    background: radial-gradient(circle at 50% 42%, #2c1d13 0%, #160e09 100%);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 6px 8px 4px;
    position: relative;
    overflow: hidden;
  }

  /* 맞은편 친구 3명 좌석 */
  .friends-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 4px;
    height: 92px;
    align-items: end;
    z-index: 5;
  }
  .seat-box {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .char-svg-wrap {
    width: 68px;
    height: 68px;
    position: relative;
    transition: transform 0.2s;
  }
  .char-svg-wrap.eating { animation: bounceEat 0.45s ease 2; }
  @keyframes bounceEat {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-6px) scale(1.06); }
  }
  .name-tag {
    font-size: 10.5px;
    font-weight: 800;
    background: rgba(0,0,0,0.65);
    padding: 2px 7px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.2);
    margin-top: -4px;
    z-index: 2;
    white-space: nowrap;
  }
  .name-tag.online { border-color: #06d6a0; color: #80ffdb; }
  .speech-pop {
    position: absolute;
    bottom: 84%;
    left: 50%;
    transform: translateX(-50%);
    background: #ffffff;
    color: #111;
    font-size: 11px;
    font-weight: 800;
    padding: 4px 8px;
    border-radius: 10px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.45);
    white-space: nowrap;
    max-width: 135px;
    overflow: hidden;
    text-overflow: ellipsis;
    z-index: 25;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.2s;
  }
  .speech-pop.show { opacity: 1; }

  /* 중앙 큰 은색 포장마차 쟁반 */
  .silver-tray-wrap {
    position: relative;
    margin: 2px auto;
    width: 96%;
    max-width: 390px;
    height: 178px;
    background: radial-gradient(ellipse at 45% 38%, #f1f3f5 0%, #ced4da 55%, #868e96 92%, #495057 100%);
    border-radius: 50% / 44%;
    border: 5px solid #dee2e6;
    box-shadow: 0 10px 24px rgba(0,0,0,0.75), inset 0 3px 10px rgba(255,255,255,0.8), inset 0 -5px 12px rgba(0,0,0,0.35);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 6;
  }
  .tray-dish {
    position: absolute;
    cursor: pointer;
    transition: transform 0.12s;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .tray-dish:active { transform: scale(0.92); }
  .dish-label {
    font-size: 9.5px;
    font-weight: 900;
    color: #fff;
    background: rgba(15,20,35,0.78);
    padding: 1px 6px;
    border-radius: 6px;
    margin-top: -4px;
    white-space: nowrap;
  }

  /* 접시 위치 배치 */
  #dish-bangeo { left: 10px; top: 14px; width: 132px; }
  #dish-kimbap { right: 12px; top: 16px; width: 126px; }
  #dish-soju   { right: 20px; bottom: 8px; width: 92px; }
  #dish-water  { left: 22px; bottom: 10px; width: 64px; }
  #dish-service{ left: 50%; bottom: 8px; transform: translateX(-50%); width: 92px; display: none; }

  /* 빈 소주병 카운터 */
  .bottle-rack {
    position: absolute;
    right: 6px;
    bottom: 6px;
    display: flex;
    gap: 2px;
    align-items: flex-end;
    z-index: 8;
    background: rgba(0,0,0,0.45);
    padding: 3px 6px;
    border-radius: 8px;
    font-size: 10px;
    color: #80ed99;
    font-weight: 800;
  }

  /* 내 캐릭터 좌석 (하단 중앙) */
  .my-seat-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    height: 68px;
    position: relative;
    z-index: 9;
  }

  /* 건배 & 먹방 이펙트 오버레이 */
  #clink-effect {
    position: absolute;
    inset: 0;
    pointer-events: none;
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 30;
    font-size: 28px;
    font-weight: 900;
    color: #ffd166;
    text-shadow: 0 3px 14px rgba(0,0,0,0.9);
    background: radial-gradient(circle, rgba(255,209,102,0.22) 0%, transparent 65%);
  }

  /* 사장님 등장 배너 */
  #boss-toast {
    position: absolute;
    top: 8px; left: 12px; right: 12px;
    background: linear-gradient(135deg, #ff9f1c, #e71d36);
    color: #fff;
    padding: 8px 12px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 800;
    box-shadow: 0 6px 18px rgba(0,0,0,0.6);
    z-index: 35;
    display: none;
    align-items: center;
    gap: 8px;
  }

  /* 3. 엄지 빠른 액션 버튼 바 */
  .quick-actions {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 5px;
    padding: 5px 8px;
    background: #121833;
    border-top: 1px solid rgba(255,255,255,0.1);
    flex-shrink: 0;
  }
  .act-btn {
    border: none;
    border-radius: 10px;
    padding: 7px 4px;
    font-size: 11.5px;
    font-weight: 800;
    color: #fff;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }
  .act-btn:active { transform: translateY(2px); }
  .b-fish { background: linear-gradient(135deg, #e63946, #9d0208); }
  .b-kim  { background: linear-gradient(135deg, #f77f00, #d62828); }
  .b-soju { background: linear-gradient(135deg, #2b9348, #007f5f); }
  .b-srv  { background: linear-gradient(135deg, #3a86ff, #4361ee); }

  /* 4. 실시간 채팅 로그 & 입력창 */
  #chat-panel {
    height: 18dvh;
    min-height: 108px;
    background: #080c1d;
    border-top: 1px solid rgba(255,255,255,0.12);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }
  #chat-log {
    flex: 1;
    overflow-y: auto;
    padding: 5px 10px;
    font-size: 12px;
    line-height: 1.45;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .chat-line b { color: #ffd166; }
  .chat-line.sys { color: #80ed99; font-size: 11px; }
  .chat-input-row {
    display: flex;
    gap: 6px;
    padding: 5px 8px 8px;
    background: #0d132a;
  }
  #chatInput {
    flex: 1;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.22);
    border-radius: 10px;
    padding: 7px 11px;
    color: #fff;
    font-size: 16px; /* iOS 줌 방지 */
    outline: none;
  }
  #sendBtn {
    background: #ffd166;
    color: #111;
    border: none;
    border-radius: 10px;
    padding: 0 14px;
    font-weight: 900;
    font-size: 13px;
    cursor: pointer;
  }

  /* 5. 시작 로비 모달 */
  #lobby-modal {
    position: absolute;
    inset: 0;
    background: rgba(5, 9, 24, 0.96);
    z-index: 100;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 18px;
    overflow-y: auto;
  }
  .lobby-card {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,209,102,0.4);
    border-radius: 20px;
    padding: 18px 16px;
  }
  .lobby-title { font-size: 21px; font-weight: 900; color: #ffd166; text-align: center; margin-bottom: 4px; }
  .lobby-sub { font-size: 12px; color: #b8c5e0; text-align: center; margin-bottom: 14px; }
  .field-label { font-size: 12px; font-weight: 800; color: #ffd166; margin-bottom: 6px; display: block; }
  .text-in {
    width: 100%;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.25);
    background: rgba(0,0,0,0.45);
    color: #fff;
    font-size: 16px;
    margin-bottom: 12px;
  }
  .char-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-bottom: 14px;
  }
  .char-pick {
    background: rgba(0,0,0,0.4);
    border: 2px solid rgba(255,255,255,0.16);
    border-radius: 12px;
    padding: 8px;
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
  }
  .char-pick.selected {
    border-color: #06d6a0;
    background: rgba(6, 214, 160, 0.16);
  }
  .char-pick-svg { width: 46px; height: 46px; flex-shrink: 0; }
  .char-pick-name { font-size: 12.5px; font-weight: 800; }
  .lobby-btns { display: flex; flex-direction: column; gap: 8px; }
  .btn-main {
    width: 100%; padding: 13px; border-radius: 12px; border: none;
    background: linear-gradient(90deg, #06d6a0, #118ab2);
    color: #fff; font-size: 15px; font-weight: 900; cursor: pointer;
  }
  .join-row { display: flex; gap: 6px; }
  .join-in {
    width: 115px; padding: 11px; border-radius: 12px;
    border: 1px solid rgba(255,209,102,0.5); background: rgba(0,0,0,0.5);
    color: #ffd166; font-size: 16px; font-weight: 900; text-align: center;
  }
  .btn-join {
    flex: 1; padding: 11px; border-radius: 12px; border: none;
    background: linear-gradient(90deg, #ffd166, #f77f00);
    color: #111; font-size: 14px; font-weight: 900; cursor: pointer;
  }
</style>
</head>
<body>
<div id="app">
  <!-- 상단 광안리 밤바다 & 광안대교 -->
  <div id="sky-area">
    <canvas id="oceanCanvas"></canvas>
    <div class="top-hud">
      <button class="badge-btn" id="roomBadge" onclick="copyInviteLink()">🍶 방 #---- 🔗초대복사</button>
      <div style="display:flex; gap:5px;">
        <button class="badge-btn" onclick="callBossService()">🔔사장님~</button>
        <button class="badge-btn" onclick="launchFireworkShow(true)">🎆폭죽</button>
      </div>
    </div>
    <div class="tipsy-bar-wrap">
      <span class="tipsy-label" id="tipsyText">😊 기분 좋음 0%</span>
      <div class="tipsy-track"><div class="tipsy-fill" id="tipsyFill"></div></div>
      <span class="tipsy-label" id="bottleCountTop">🍶 0병</span>
    </div>
  </div>

  <!-- 중앙 포장마차 테이블 -->
  <div id="pocha-stage">
    <div id="boss-toast">👨‍🍳 방어집 사장님: "광안리 단골 서비스 나갑니데이~ 맛있게 드이소!"</div>
    <div id="clink-effect">🍶 짠~! 캬~!! ✨</div>

    <!-- 맞은편 3자리 -->
    <div class="friends-row" id="friendsRow">
      <div class="seat-box" id="seat-1">
        <div class="speech-pop" id="pop-1"></div>
        <div class="char-svg-wrap" id="avatar-1"></div>
        <div class="name-tag" id="name-1">자리 1</div>
      </div>
      <div class="seat-box" id="seat-2">
        <div class="speech-pop" id="pop-2"></div>
        <div class="char-svg-wrap" id="avatar-2"></div>
        <div class="name-tag" id="name-2">자리 2</div>
      </div>
      <div class="seat-box" id="seat-3">
        <div class="speech-pop" id="pop-3"></div>
        <div class="char-svg-wrap" id="avatar-3"></div>
        <div class="name-tag" id="name-3">자리 3</div>
      </div>
    </div>

    <!-- 큰 은색 쟁반 & 리얼 음식 SVG -->
    <div class="silver-tray-wrap">
      <!-- 1. 제철 대방어회 접시 -->
      <div class="tray-dish" id="dish-bangeo" onclick="doAction('bangeo')">
        <svg viewBox="0 0 140 92" width="128" height="84">
          <ellipse cx="70" cy="48" rx="64" ry="38" fill="#1b263b" stroke="#e0e1dd" stroke-width="3"/>
          <ellipse cx="70" cy="48" rx="56" ry="31" fill="#f8f9fa" opacity="0.92"/>
          <!-- 시소잎 -->
          <ellipse cx="52" cy="42" rx="22" ry="14" fill="#40916c" transform="rotate(-15 52 42)"/>
          <ellipse cx="86" cy="44" rx="22" ry="14" fill="#52b788" transform="rotate(15 86 44)"/>
          <!-- 두툼한 대방어 혈합육+배꼽살 슬라이스들 -->
          <g>
            <path d="M26,48 Q38,26 58,34 L52,58 Q34,60 26,48 Z" fill="#f4a261"/>
            <path d="M26,48 Q38,28 56,35 L54,43 Q36,38 26,48 Z" fill="#c1121f"/>
            <path d="M30,49 L50,55" stroke="#fff" stroke-width="1.5" opacity="0.7"/>

            <path d="M48,52 Q62,28 84,36 L78,62 Q58,64 48,52 Z" fill="#ffb5a7"/>
            <path d="M48,52 Q62,30 82,37 L80,45 Q60,40 48,52 Z" fill="#ae2012"/>
            <circle cx="66" cy="48" r="2" fill="#ffd166"/>

            <path d="M72,50 Q86,28 110,38 L102,62 Q82,64 72,50 Z" fill="#fec5bb"/>
            <path d="M72,50 Q86,30 108,39 L105,46 Q86,41 72,50 Z" fill="#9b2226"/>
            <circle cx="92" cy="50" r="1.8" fill="#ffd166"/>
          </g>
          <!-- 레몬 & 생와사비 -->
          <path d="M104,26 A12,12 0 0,1 122,40 L104,40 Z" fill="#ffd166" stroke="#f4a261" stroke-width="2"/>
          <circle cx="32" cy="64" r="7" fill="#80ed99"/>
        </svg>
        <span class="dish-label">🐟 제철 대방어회</span>
      </div>

      <!-- 2. 아귀간소금김밥 세트 -->
      <div class="tray-dish" id="dish-kimbap" onclick="doAction('kimbap')">
        <svg viewBox="0 0 136 88" width="122" height="80">
          <rect x="10" y="14" width="116" height="62" rx="12" fill="#2b2d42" stroke="#adb5bd" stroke-width="2.5"/>
          <!-- 소금김밥 4피스 + 위에 올라간 녹진한 주황빛 아귀간 -->
          <g transform="translate(22, 26)">
            <ellipse cx="14" cy="24" rx="13" ry="10" fill="#111"/>
            <ellipse cx="14" cy="21" rx="11" ry="8" fill="#fff"/>
            <ellipse cx="14" cy="15" rx="9" ry="6" fill="#f48c06"/>
            <circle cx="14" cy="14" r="1.8" fill="#52b788"/>
          </g>
          <g transform="translate(48, 22)">
            <ellipse cx="14" cy="24" rx="13" ry="10" fill="#111"/>
            <ellipse cx="14" cy="21" rx="11" ry="8" fill="#fff"/>
            <ellipse cx="14" cy="15" rx="9.5" ry="6.5" fill="#fb8500"/>
            <circle cx="14" cy="14" r="1.8" fill="#52b788"/>
          </g>
          <g transform="translate(74, 26)">
            <ellipse cx="14" cy="24" rx="13" ry="10" fill="#111"/>
            <ellipse cx="14" cy="21" rx="11" ry="8" fill="#fff"/>
            <ellipse cx="14" cy="15" rx="9.5" ry="6.5" fill="#f48c06"/>
            <circle cx="14" cy="14" r="1.8" fill="#52b788"/>
          </g>
          <!-- 종지 참기름 소금장 -->
          <circle cx="110" cy="56" r="9" fill="#e9ecef"/>
          <circle cx="110" cy="56" r="6" fill="#e09f3e"/>
        </svg>
        <span class="dish-label">🧡🍙 아귀간소금김밥</span>
      </div>

      <!-- 3. 얼음 냉수 -->
      <div class="tray-dish" id="dish-water" onclick="doAction('water')">
        <svg viewBox="0 0 64 64" width="54" height="54">
          <path d="M18,12 L46,12 L42,54 L22,54 Z" fill="rgba(144,224,239,0.45)" stroke="#caf0f8" stroke-width="2.5"/>
          <path d="M20,24 L44,24 L41,52 L23,52 Z" fill="rgba(72,202,228,0.65)"/>
          <rect x="24" y="27" width="7" height="7" rx="1.5" fill="#fff" opacity="0.85"/>
          <rect x="33" y="30" width="7" height="7" rx="1.5" fill="#fff" opacity="0.85"/>
        </svg>
        <span class="dish-label">🧊 해장 냉수</span>
      </div>

      <!-- 4. 서비스 안주 슬롯 (컵라면 / 콘치즈 / 매운탕) -->
      <div class="tray-dish" id="dish-service" onclick="doAction('service')">
        <div id="serviceSvgBox"></div>
        <span class="dish-label" id="serviceLabel">🍜 서비스 컵라면</span>
      </div>

      <!-- 5. 초록병 참이슬 & 투명 소주잔 -->
      <div class="tray-dish" id="dish-soju" onclick="doAction('soju')">
        <svg viewBox="0 0 96 76" width="88" height="70">
          <!-- 초록색 소주병 -->
          <rect x="24" y="6" width="10" height="7" rx="1.5" fill="#e63946"/>
          <path d="M25,13 L33,13 L35,26 L41,34 L41,66 Q41,70 37,70 L21,70 Q17,70 17,66 L17,34 L23,26 Z" fill="#2b9348" stroke="#52b788" stroke-width="1.5"/>
          <rect x="19" y="40" width="20" height="17" rx="2" fill="#f8f9fa"/>
          <text x="29" y="51" font-size="6.5" font-weight="900" fill="#1b4332" text-anchor="middle">참이슬</text>
          <!-- 투명 소주잔 2개 -->
          <path d="M50,44 L66,44 L64,66 L52,66 Z" fill="rgba(255,255,255,0.45)" stroke="#fff" stroke-width="1.8"/>
          <path d="M51,51 L65,51 L63.5,65 L52.5,65 Z" fill="rgba(202,240,248,0.75)"/>
          <path d="M70,46 L86,46 L84,68 L72,68 Z" fill="rgba(255,255,255,0.45)" stroke="#fff" stroke-width="1.8"/>
          <path d="M71,53 L85,53 L83.5,67 L72.5,67 Z" fill="rgba(202,240,248,0.75)"/>
        </svg>
        <span class="dish-label">🍶 참이슬 짠!</span>
      </div>
    </div>

    <!-- 내 캐릭터 좌석 + 빈 병 표시 -->
    <div class="my-seat-row">
      <div class="seat-box" id="seat-0">
        <div class="speech-pop" id="pop-0"></div>
        <div class="char-svg-wrap" id="avatar-0"></div>
        <div class="name-tag online" id="name-0">나</div>

      <div class="bottle-rack" id="bottleRack">🍾 빈병 0</div>

  <!-- 하단 엄지 빠른 먹방 버튼 -->
  <div class="quick-actions">
    <button class="act-btn b-fish" onclick="doAction('bangeo')">🐟 대방어 한점</button>
    <button class="act-btn b-kim" onclick="doAction('kimbap')">🧡 아귀간김밥</button>
    <button class="act-btn b-soju" onclick="doAction('soju')">🍶 참이슬 짠!</button>
    <button class="act-btn b-srv" onclick="doAction('water')">🧊 시원한 물</button>
  </div>

  <!-- 실시간 채팅창 -->
  <div id="chat-panel">
    <div id="chat-log"></div>
    <div class="chat-input-row">
      <input type="text" id="chatInput" placeholder="친구들에게 한마디 쳐보세요..." maxlength="60" onkeydown="if(event.key==='Enter') sendChat()">
      <button id="sendBtn" onclick="sendChat()">전송</button>
    </div>
  </div>

  <!-- 입장 로비 모달 -->
  <div id="lobby-modal">
    <div class="lobby-card">
      <div class="lobby-title">🌉 광안리 밤바다 포차</div>
      <div class="lobby-sub">대방어 · 아귀간소금김밥 · 초록병 참이슬 실시간 합석</div>

      <label class="field-label">1. 내 별명 입력</label>
      <input type="text" id="nickInput" class="text-in" placeholder="예: 광안리주당" maxlength="8" value="">

      <label class="field-label">2. 내 캐릭터 선택 (진짜 사람 스타일)</label>
      <div class="char-grid" id="charPicker"></div>

      <label class="field-label">3. 테이블 입장하기</label>
      <div class="lobby-btns">
        <button class="btn-main" onclick="createRoom()">🍶 새 광안리 테이블 잡기 (방장)</button>
        <div class="join-row">
          <input type="text" id="roomInput" class="join-in" placeholder="4자리 번호" maxlength="4" inputmode="numeric">
          <button class="btn-join" onclick="joinRoom()">🚪 친구 방 합석하기</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
/* 1. 웹툰 스타일 인물 캐릭터 4종 SVG 생성기 */
const CHAR_TYPES = [
  { id: 'long_f',  label: '긴머리 여자', outfit: '#e07a5f', hair: '#2b1d16' },
  { id: 'short_f', label: '단발머리 여자', outfit: '#f2cc8f', hair: '#3d261c' },
  { id: 'perm_m',  label: '파마머리 남자', outfit: '#457b9d', hair: '#221a15' },
  { id: 'dandy_m', label: '댄디숏컷 남자', outfit: '#52b788', hair: '#1b1d24' }
];

function renderHumanSVG(typeId, tipsy = 0) {
  const blushOpacity = Math.min(0.85, tipsy / 90);
  const sleepy = tipsy >= 65;
  const c = CHAR_TYPES.find(t => t.id === typeId) || CHAR_TYPES[0];

  let backHair = '';
  let frontHair = '';
  if (typeId === 'long_f') {
    backHair = `<path d="M16,32 Q12,62 18,86 L82,86 Q88,62 84,32 Z" fill="${c.hair}"/>`;
    frontHair = `<path d="M20,34 Q32,12 50,14 Q68,12 80,34 Q66,22 50,24 Q34,22 20,34 Z" fill="${c.hair}"/>`;
  } else if (typeId === 'short_f') {
    backHair = `<path d="M17,34 Q14,56 24,66 L76,66 Q86,56 83,34 Z" fill="${c.hair}"/>`;
    frontHair = `<path d="M20,35 Q30,13 50,14 Q70,13 80,35 Q65,24 50,25 Q35,24 20,35 Z" fill="${c.hair}"/>`;
  } else if (typeId === 'perm_m') {
    frontHair = `
      <circle cx="30" cy="24" r="11" fill="${c.hair}"/>
      <circle cx="44" cy="19" r="12" fill="${c.hair}"/>
      <circle cx="58" cy="19" r="12" fill="${c.hair}"/>
      <circle cx="70" cy="24" r="11" fill="${c.hair}"/>
      <circle cx="23" cy="33" r="8" fill="${c.hair}"/>
      <circle cx="77" cy="33" r="8" fill="${c.hair}"/>`;
  } else {
    frontHair = `<path d="M21,36 Q24,14 50,14 Q76,14 79,36 Q66,23 52,26 L44,21 L38,27 Q28,25 21,36 Z" fill="${c.hair}"/>`;
  }

  const eyes = sleepy
    ? `<path d="M35,43 Q40,46 45,43" stroke="#222" stroke-width="2.5" fill="none" stroke-linecap="round"/>
       <path d="M55,43 Q60,46 65,43" stroke="#222" stroke-width="2.5" fill="none" stroke-linecap="round"/>`
    : `<ellipse cx="40" cy="42" rx="3.2" ry="3.8" fill="#1d1d1d"/>
       <circle cx="41" cy="40.8" r="1.1" fill="#fff"/>
       <ellipse cx="60" cy="42" rx="3.2" ry="3.8" fill="#1d1d1d"/>
       <circle cx="61" cy="40.8" r="1.1" fill="#fff"/>`;

  const mouth = tipsy >= 50
    ? `<path d="M44,54 Q50,60 56,54 Z" fill="#e63946"/>`
    : `<path d="M45,54 Q50,58 55,54" stroke="#b56576" stroke-width="2.3" fill="none" stroke-linecap="round"/>`;

  return `<svg viewBox="0 0 100 92" width="100%" height="100%">
    ${backHair}
    <!-- 어깨 및 니트/셔츠 복장 -->
    <path d="M18,88 Q22,66 50,66 Q78,66 82,88 Z" fill="${c.outfit}"/>
    <rect x="44" y="58" width="12" height="12" rx="4" fill="#ffddd2"/>
    <!-- 얼굴 -->
    <ellipse cx="50" cy="43" rx="23" ry="24" fill="#ffe5d9"/>
    <!-- 양 볼 취기 홍조 -->
    <ellipse cx="34" cy="49" rx="6.5" ry="3.8" fill="#ff4d6d" opacity="${blushOpacity}"/>
    <ellipse cx="66" cy="49" rx="6.5" ry="3.8" fill="#ff4d6d" opacity="${blushOpacity}"/>
    <!-- 눈썹 / 눈 / 입 -->
    <path d="M35,35 Q40,33 45,35" stroke="#3d261c" stroke-width="2" fill="none"/>
    <path d="M55,35 Q60,33 65,35" stroke="#3d261c" stroke-width="2" fill="none"/>
    ${eyes}
    ${mouth}
    ${frontHair}
  </svg>`;
}

const SERVICE_SVGS = [
  {
    name: '🍜 빨간 컵라면',
    svg: `<svg viewBox="0 0 90 74" width="84" height="68">
      <path d="M22,26 L68,26 L62,66 L28,66 Z" fill="#d62828" stroke="#fff" stroke-width="2"/>
      <ellipse cx="45" cy="26" rx="23" ry="8" fill="#f77f00"/>
      <path d="M32,25 Q45,12 58,25" stroke="#ffd166" stroke-width="4" fill="none"/>
      <line x1="48" y1="8" x2="74" y2="18" stroke="#ddb892" stroke-width="3"/>
      <path d="M36,14 Q33,7 37,2" stroke="rgba(255,255,255,0.7)" stroke-width="2" fill="none"/>
      <path d="M48,13 Q45,6 49,1" stroke="rgba(255,255,255,0.7)" stroke-width="2" fill="none"/>
    </svg>`
  },
  {
    name: '🧀 철판 콘치즈',
    svg: `<svg viewBox="0 0 90 74" width="84" height="68">
      <ellipse cx="45" cy="44" rx="38" ry="20" fill="#212529" stroke="#495057" stroke-width="3"/>
      <ellipse cx="45" cy="43" rx="31" ry="15" fill="#ffd166"/>
      <circle cx="35" cy="41" r="3" fill="#ffb703"/><circle cx="48" cy="45" r="3" fill="#ffb703"/>
      <circle cx="56" cy="39" r="3" fill="#ffb703"/><circle cx="42" cy="38" r="2.5" fill="#52b788"/>
    </svg>`
  },
  {
    name: '🍲 방어 서더리 매운탕',
    svg: `<svg viewBox="0 0 90 74" width="84" height="68">
      <ellipse cx="45" cy="44" rx="37" ry="21" fill="#1d1e2c" stroke="#6c757d" stroke-width="3"/>
      <ellipse cx="45" cy="43" rx="31" ry="16" fill="#c1121f"/>
      <rect x="34" y="37" width="10" height="8" rx="1" fill="#fff3b0"/>
      <circle cx="54" cy="44" r="5" fill="#52b788"/>
    </svg>`
  }
];

/* 2. 상태 관리 및 PeerJS 실시간 멀티플레이 */
let selectedChar = 'long_f';
let myNick = '';
let roomCode = '';
let isHost = false;
let peer = null;
let hostConn = null;
let clientConns = [];

let state = {
  glasses: 0,
  bottles: 0,
  serviceLevel: 0,
  seats: [
    { nick: '나', char: 'long_f', tipsy: 0, isReal: true, peerId: 'local' },
    { nick: '민지(단골)', char: 'short_f', tipsy: 10, isReal: false, peerId: null },
    { nick: '준호(주당)', char: 'perm_m', tipsy: 15, isReal: false, peerId: null },
    { nick: '현우(막내)', char: 'dandy_m', tipsy: 5, isReal: false, peerId: null }
  ]
};

// 로비 캐릭터 선택기 초기화
function initPicker() {
  const box = document.getElementById('charPicker');
  box.innerHTML = '';
  CHAR_TYPES.forEach(ct => {
    const div = document.createElement('div');
    div.className = 'char-pick' + (ct.id === selectedChar ? ' selected' : '');
    div.onclick = () => { selectedChar = ct.id; initPicker(); };
    div.innerHTML = `<div class="char-pick-svg">${renderHumanSVG(ct.id, 15)}</div>
                     <div class="char-pick-name">${ct.label}</div>`;
    box.appendChild(div);
  });

  // URL ?room=XXXX 자동 감지
  const params = new URLSearchParams(location.search);
  const r = params.get('room');
  if (r && /^\d{4}$/.test(r)) {
    document.getElementById('roomInput').value = r;
  }
}
initPicker();

const PEER_PREFIX = 'gw-pocha-2026-room-';

function createRoom() {
  myNick = (document.getElementById('nickInput').value || '').trim() || '광안리대장';
  roomCode = String(Math.floor(1000 + Math.random() * 9000));
  isHost = true;

  // 기본 좌석 배치 (나 + 빈자리 AI 친구)
  const others = CHAR_TYPES.filter(c => c.id !== selectedChar);
  state.seats[0] = { nick: myNick, char: selectedChar, tipsy: 0, isReal: true, peerId: 'host' };
  const botNames = ['수빈', '지훈', '다은'];
  for (let i = 1; i <= 3; i++) {
    state.seats[i] = { nick: botNames[i-1], char: others[i-1].id, tipsy: 0, isReal: false, peerId: null };
  }

  enterStage();
  addChat('시스템', `광안리 #${roomCode}번 테이블을 잡았습니다! 상단 방 번호를 눌러 카톡에 초대 링크를 보내보세요.`, true);

  try {
    peer = new Peer(PEER_PREFIX + roomCode);
    peer.on('open', () => {
      document.getElementById('roomBadge').textContent = `🍶 방 #${roomCode} 🔗초대복사`;
    });
    peer.on('connection', conn => {
      clientConns.push(conn);
      conn.on('data', data => handleNetworkData(data, conn));
      conn.on('close', () => {
        const idx = state.seats.findIndex(s => s.peerId === conn.peer);
        if (idx > 0) {
          addChat('시스템', `${state.seats[idx].nick}님이 자리에서 일어났습니다.`, true);
          state.seats[idx].isReal = false;
          state.seats[idx].peerId = null;
          broadcastState();
          renderTable();
        }
      });
    });
    peer.on('error', () => {
      document.getElementById('roomBadge').textContent = `🍶 방 #${roomCode} (단독모드)`;
    });
  } catch (e) {}
}

function joinRoom() {
  const code = (document.getElementById('roomInput').value || '').trim();
  if (!/^\d{4}$/.test(code)) {
    alert('친구에게 받은 4자리 숫자 방 번호를 입력해 주세요!');
    return;
  }
  myNick = (document.getElementById('nickInput').value || '').trim() || '광안리친구';
  roomCode = code;
  isHost = false;

  enterStage();
  addChat('시스템', `#${roomCode}번 광안리 테이블로 합석 연결 중입니다...`, true);

  peer = new Peer();
  peer.on('open', myId => {
    hostConn = peer.connect(PEER_PREFIX + roomCode);
    hostConn.on('open', () => {
      document.getElementById('roomBadge').textContent = `🟢 방 #${roomCode} 🔗초대복사`;
      hostConn.send({ type: 'JOIN', nick: myNick, char: selectedChar, peerId: myId });
    });
    hostConn.on('data', data => handleNetworkData(data, hostConn));
    hostConn.on('error', () => addChat('시스템', '방 연결에 실패했어요. 번호를 다시 확인해 주세요.', true));
  });
}

function enterStage() {
  document.getElementById('lobby-modal').style.display = 'none';
  document.getElementById('roomBadge').textContent = `🍶 방 #${roomCode} 🔗초대복사`;
  renderTable();
}

function copyInviteLink() {
  const base = location.origin + location.pathname;
  const url = `${base}?room=${roomCode}`;
  if (navigator.clipboard) {
    navigator.clipboard.writeText(url).then(() => {
      addChat('시스템', `📋 초대 링크 복사 완료! 카톡방에 붙여넣기 하세요: ${url}`, true);
      showPop(0, '초대 링크 복사 완료! 🔗');
    });
  } else {
    prompt('이 주소를 복사해서 친구들에게 카톡으로 보내세요:', url);
  }
}

/* 3. 멀티플레이 패킷 동기화 */
function broadcast(payload) {
  clientConns.forEach(c => { if (c.open) c.send(payload); });
}
function broadcastState() {
  broadcast({ type: 'SYNC', state });
}

function handleNetworkData(data, conn) {
  if (isHost) {
    if (data.type === 'JOIN') {
      let emptyIdx = state.seats.findIndex((s, idx) => idx > 0 && !s.isReal);
      if (emptyIdx === -1) emptyIdx = 3;
      state.seats[emptyIdx] = { nick: data.nick, char: data.char, tipsy: 0, isReal: true, peerId: data.peerId };
      broadcastState();
      const joinMsg = { type: 'EVENT', kind: 'join', nick: data.nick, seatIdx: emptyIdx };
      broadcast(joinMsg);
      applyEvent(joinMsg);
      renderTable();
    } else if (data.type === 'ACTION') {
      const seatIdx = state.seats.findIndex(s => s.peerId === conn.peer);
      processActionOnHost(seatIdx >= 0 ? seatIdx : 1, data.action);
    } else if (data.type === 'CHAT') {
      const seatIdx = state.seats.findIndex(s => s.peerId === conn.peer);
      const evt = { type: 'EVENT', kind: 'chat', seatIdx: seatIdx >= 0 ? seatIdx : 1, nick: data.nick, text: data.text };
      broadcast(evt);
      applyEvent(evt);
    }
  } else {
    if (data.type === 'SYNC') {
      state = data.state;
      renderTable();
    } else if (data.type === 'EVENT') {
      if (data.state) state = data.state;
      renderTable();
      applyEvent(data);
    }
  }
}

function getMyVisualSlot(logicalIdx) {
  // 내 화면에서는 내가 항상 하단 중앙(slot 0)에 보이도록 매핑
  let myLogical = 0;
  if (!isHost && peer) {
    const found = state.seats.findIndex(s => s.peerId === peer.id);
    if (found >= 0) myLogical = found;
  }
  if (logicalIdx === myLogical) return 0;
  const others = [0, 1, 2, 3].filter(i => i !== myLogical);
  return others.indexOf(logicalIdx) + 1;
}

function renderTable() {
  for (let logical = 0; logical < 4; logical++) {
    const visual = getMyVisualSlot(logical);
    const s = state.seats[logical];
    const av = document.getElementById('avatar-' + visual);
    const nm = document.getElementById('name-' + visual);
    if (av && s) {
      av.innerHTML = renderHumanSVG(s.char, s.tipsy);
      nm.textContent = (visual === 0 ? `⭐ ${s.nick}` : (s.isReal ? `🟢 ${s.nick}` : s.nick));
      nm.className = 'name-tag' + (s.isReal ? ' online' : '');
    }
    if (visual === 0 && s) {
      document.getElementById('tipsyFill').style.width = s.tipsy + '%';
      let label = `😊 멀쩡함 ${s.tipsy}%`;
      if (s.tipsy >= 80) label = `💫 만취직전 ${s.tipsy}%`;
      else if (s.tipsy >= 45) label = `☺️ 알딸딸~ ${s.tipsy}%`;
      document.getElementById('tipsyText').textContent = label;
      document.getElementById('app').className = s.tipsy >= 85 ? 'drunk-dizzy' : '';
    }
  }
  document.getElementById('bottleCountTop').textContent = `🍶 ${state.bottles}병`;
  document.getElementById('bottleRack').textContent = `🍾 빈병 ${state.bottles}`;

  const srvBox = document.getElementById('dish-service');
  if (state.serviceLevel > 0) {
    const srv = SERVICE_SVGS[(state.serviceLevel - 1) % SERVICE_SVGS.length];
    srvBox.style.display = 'flex';
    document.getElementById('serviceSvgBox').innerHTML = srv.svg;
    document.getElementById('serviceLabel').textContent = srv.name;
  }
}

/* 4. 먹방 · 건배 · 사장님 서비스 액션 */
function doAction(action) {
  if (navigator.vibrate) navigator.vibrate(25);
  if (isHost || !hostConn || !hostConn.open) {
    processActionOnHost(0, action);
  } else {
    hostConn.send({ type: 'ACTION', action });
  }
}

function processActionOnHost(seatIdx, action) {
  const actor = state.seats[seatIdx];
  if (!actor) return;

  if (action === 'soju') {
    state.glasses++;
    state.seats.forEach(s => { s.tipsy = Math.min(100, s.tipsy + 14); });
    if (state.glasses % 4 === 0) {
      state.bottles++;
      if (state.bottles % 2 === 1) state.serviceLevel++;
    }
  } else if (action === 'water') {
    actor.tipsy = Math.max(0, actor.tipsy - 22);
  } else if (action === 'service') {
    actor.tipsy = Math.max(0, actor.tipsy - 12);
  } else {
    actor.tipsy = Math.max(0, actor.tipsy - 4);
  }

  const evt = {
    type: 'EVENT',
    kind: 'action',
    action,
    seatIdx,
    nick: actor.nick,
    bossTriggered: (action === 'soju' && state.glasses % 4 === 0 && state.bottles % 2 === 1),
    state
  };
  broadcast(evt);
  renderTable();
  applyEvent(evt);
}

function callBossService() {
  if (isHost || !hostConn || !hostConn.open) {
    state.serviceLevel++;
    const evt = { type: 'EVENT', kind: 'boss', state };
    broadcast(evt);
    renderTable();
    applyEvent(evt);
  } else {
    hostConn.send({ type: 'ACTION', action: 'service' });
    triggerBossToast();
  }
}

function applyEvent(evt) {
  if (evt.kind === 'join') {
    addChat('시스템', `🎉 ${evt.nick}님이 광안리 은쟁반 테이블에 합석했습니다!`, true);
    showPop(getMyVisualSlot(evt.seatIdx), '반가워요!! 짠합시다~ 🍶');
    return;
  }
  if (evt.kind === 'boss') {
    triggerBossToast();
    return;
  }
  if (evt.kind === 'chat') {
    const vSlot = getMyVisualSlot(evt.seatIdx);
    showPop(vSlot, evt.text);
    addChat(evt.nick, evt.text, false);
    maybeBotReply(evt.text);
    return;
  }
  if (evt.kind === 'firework') {
    launchFireworkShow(false);
    return;
  }
  if (evt.kind === 'action') {
    const vSlot = getMyVisualSlot(evt.seatIdx);
    const av = document.getElementById('avatar-' + vSlot);
    if (av) {
      av.classList.remove('eating');
      void av.offsetWidth;
      av.classList.add('eating');
    }

    if (evt.action === 'bangeo') {
      showPop(vSlot, '대방어 배꼽살 기름기 미쳤다! 🐟');
      addChat(evt.nick, '제철 대방어회를 와사비 올려 한 점 먹었습니다.', true);
    } else if (evt.action === 'kimbap') {
      showPop(vSlot, '아귀간+소금김밥 녹진해~ 🧡🍙');
      addChat(evt.nick, '아귀간소금김밥 세트를 참기름장에 찍어 먹었습니다.', true);
    } else if (evt.action === 'soju') {
      const clink = document.getElementById('clink-effect');
      clink.style.display = 'flex';
      setTimeout(() => clink.style.display = 'none', 900);
      showPop(vSlot, '참이슬 짠~! 캬 달다! 🍶');
      addChat(evt.nick, '모두 함께 초록병 참이슬 건배! 짠~!', true);
      if (evt.bossTriggered) triggerBossToast();
      if (state.bottles > 0 && state.glasses % 4 === 0) launchFireworkShow(false);
    } else if (evt.action === 'water') {
      showPop(vSlot, '얼음물로 해장 싹~ 🧊');
      addChat(evt.nick, '시원한 얼음 냉수를 마셔 취기를 식혔습니다.', true);
    } else if (evt.action === 'service') {
      const srv = SERVICE_SVGS[(Math.max(1, state.serviceLevel) - 1) % SERVICE_SVGS.length];
      showPop(vSlot, `${srv.name} 국물 끝내준다!`);
      addChat(evt.nick, `사장님 서비스 ${srv.name}을(를) 맛있게 먹었습니다!`, true);
    }
  }
}

function triggerBossToast() {
  const srv = SERVICE_SVGS[(Math.max(1, state.serviceLevel) - 1) % SERVICE_SVGS.length];
  const toast = document.getElementById('boss-toast');
  toast.textContent = `👨‍🍳 사장님: "광안리 서비스로 ${srv.name} 가져왔습니데이! 따뜻할 때 드이소~"`;
  toast.style.display = 'flex';
  addChat('방어집 사장님', `테이블에 서비스 안주 [${srv.name}]을(를) 내어주셨습니다!`, true);
  setTimeout(() => { toast.style.display = 'none'; }, 3500);
}

/* 5. 실시간 채팅 & 솔로 플레이 시 절친 리액션 */
function sendChat() {
  const input = document.getElementById('chatInput');
  const text = (input.value || '').trim();
  if (!text) return;
  input.value = '';

  if (isHost || !hostConn || !hostConn.open) {
    const evt = { type: 'EVENT', kind: 'chat', seatIdx: 0, nick: myNick || '나', text };
    broadcast(evt);
    applyEvent(evt);
  } else {
    hostConn.send({ type: 'CHAT', nick: myNick, text });
  }
}

function maybeBotReply(userText) {
  // 실제 친구가 아직 안 들어왔을 때(방에 혼자일 때) 맞은편 캐릭터가 심심하지 않게 맞장구
  const realCount = state.seats.filter(s => s.isReal).length;
  if (realCount > 1 || !isHost) return;
  const replies = [
    '와 광안대교 보면서 대방어에 참이슬 진짜 최고다 ㅋㅋ',
    '아귀간소금김밥 위에 방어 올려서 같이 먹어봐 진짜 녹아!',
    '자자 이야기 좋으니까 참이슬 한 잔 더 짠하자! 🍶',
    '오늘 광안리 밤바다 분위기 미쳤다~ 폭죽 한 번 터뜨리자!',
    '사장님 서비스 컵라면 국물 마시니까 술이 쫙 깨는데? ㅋㅋ'
  ];
  setTimeout(() => {
    const botIdx = 1 + Math.floor(Math.random() * 3);
    const bot = state.seats[botIdx];
    const msg = replies[Math.floor(Math.random() * replies.length)];
    showPop(getMyVisualSlot(botIdx), msg);
    addChat(bot.nick, msg, false);
  }, 900);
}

function showPop(visualSlot, msg) {
  const pop = document.getElementById('pop-' + visualSlot);
  if (!pop) return;
  pop.textContent = msg;
  pop.classList.add('show');
  clearTimeout(pop._timer);
  pop._timer = setTimeout(() => pop.classList.remove('show'), 2800);
}

function addChat(sender, msg, isSys) {
  const log = document.getElementById('chat-log');
  const div = document.createElement('div');
  div.className = 'chat-line' + (isSys ? ' sys' : '');
  div.innerHTML = isSys ? `• ${msg}` : `<b>${sender}:</b> ${msg.replace(/</g, '&lt;')}`;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

/* 6. 광안리 밤바다 & 광안대교 & 폭죽 피날레 캔버스 */
const cvs = document.getElementById('oceanCanvas');
const ctx = cvs.getContext('2d');
let particles = [];
let t = 0;

function resizeSky() {
  cvs.width = cvs.clientWidth;
  cvs.height = cvs.clientHeight;
}
window.addEventListener('resize', resizeSky);
resizeSky();

function launchFireworkShow(syncToPeers) {
  if (syncToPeers && isHost) broadcast({ type: 'EVENT', kind: 'firework' });
  for (let b = 0; b < 5; b++) {
    setTimeout(() => {
      const x = cvs.width * (0.15 + Math.random() * 0.7);
      const y = cvs.height * (0.18 + Math.random() * 0.35);
      const palette = ['#ffd166', '#ff4d6d', '#06d6a0', '#4cc9f0', '#f72585'];
      const col = palette[Math.floor(Math.random() * palette.length)];
      for (let i = 0; i < 28; i++) {
        const a = (Math.PI * 2 * i) / 28;
        const sp = 1.2 + Math.random() * 2.4;
        particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, alpha: 1, col });
      }
    }, b * 240);
  }
}

function animateSky() {
  t += 0.03;
  const w = cvs.width, h = cvs.height;
  const seaY = h * 0.66;

  const sky = ctx.createLinearGradient(0, 0, 0, seaY);
  sky.addColorStop(0, '#040714');
  sky.addColorStop(1, '#13224a');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, w, seaY);

  ctx.fillStyle = '#071128';
  ctx.fillRect(0, seaY, w, h - seaY);

  // 광안대교 현수교
  const hue = (t * 22) % 360;
  const t1 = w * 0.28, t2 = w * 0.72, topY = h * 0.24, deckY = seaY - 10;

  ctx.strokeStyle = `hsl(${hue}, 85%, 65%)`;
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(0, deckY - 3);
  ctx.quadraticCurveTo(t1 * 0.5, deckY, t1, topY);
  ctx.quadraticCurveTo((t1 + t2) * 0.5, deckY + 6, t2, topY);
  ctx.quadraticCurveTo(t2 + (w - t2) * 0.5, deckY, w, deckY - 3);
  ctx.stroke();

  ctx.strokeStyle = '#e9ecef';
  ctx.lineWidth = 3.5;
  [t1, t2].forEach(tx => {
    ctx.beginPath(); ctx.moveTo(tx, topY); ctx.lineTo(tx, seaY); ctx.stroke();
  });

  ctx.strokeStyle = '#ffd166';
  ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(0, deckY); ctx.lineTo(w, deckY); ctx.stroke();

  // 바다 반사광
  for (let i = 0; i < 8; i++) {
    const wy = seaY + 4 + i * 4.5;
    const dx = Math.sin(t + i) * 6;
    ctx.fillStyle = `hsla(${hue}, 85%, 65%, ${0.32 - i * 0.03})`;
    ctx.fillRect(t1 - 22 + dx, wy, 44, 2);
    ctx.fillRect(t2 - 22 - dx, wy, 44, 2);
  }

  // 폭죽 파티클
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.035; p.alpha -= 0.02;
    if (p.alpha <= 0) particles.splice(i, 1);
    else {
      ctx.globalAlpha = p.alpha;
      ctx.fillStyle = p.col;
      ctx.beginPath(); ctx.arc(p.x, p.y, 2.2, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }
  }
  requestAnimationFrame(animateSky);
}
animateSky();
</script>
